# ─── Option B: Using IP address only (no HTTPS / self-signed) ───
# Use this initially when you don't have a domain yet

server {
    listen 80;
    server_name _;

    # Increase max upload size for file uploads
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket support (required for terminal)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running code execution
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
