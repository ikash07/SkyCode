# ──────────────────────────────────────────────────────
# Nginx Reverse Proxy for SkyCode Backend
# ──────────────────────────────────────────────────────
#
# USAGE:
#   1. Copy this file to /etc/nginx/sites-available/skycode
#   2. Create symlink:  sudo ln -s /etc/nginx/sites-available/skycode /etc/nginx/sites-enabled/
#   3. Remove default:  sudo rm /etc/nginx/sites-enabled/default
#   4. Test config:     sudo nginx -t
#   5. Reload:          sudo systemctl reload nginx
#
# IMPORTANT: Replace YOUR_DOMAIN_OR_IP with your actual domain or Oracle VM public IP
#

# ─── Option A: Using a domain (after Certbot adds HTTPS) ───
# Uncomment this section if you have a domain

