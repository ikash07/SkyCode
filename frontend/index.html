<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyCode-Online IDE</title>
    <meta name="description" content="SkyCode — A powerful online IDE with Docker-based code execution. Code, run and deploy from your browser." />
    <meta name="theme-color" content="#FFFDF5" />

    <!-- Brand Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Instant Preload for 0ms Splash Logo -->
    <link rel="preload" as="image" href="/logo-icon.png" fetchpriority="high" />

    <!-- Open Graph / Meta -->
    <meta property="og:title" content="SkyCode — Online IDE" />
    <meta property="og:description" content="A powerful online IDE with Docker-based code execution. Code, run and deploy from your browser." />
    <meta property="og:image" content="/logo-card.png" />

    <!-- Preconnect to Render backend for 0ms initial handshake -->
    <link rel="preconnect" href="https://skycode-t3ry.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://skycode-t3ry.onrender.com" />

    <!-- Preconnect to Monaco CDN for 0ms editor bootstrap -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Space Grotesk + Space Mono — preloaded for Neo-Brutalism UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=block"
      rel="stylesheet"
    />
  </head>
  <body style="background: #FFFDF5; margin: 0; padding: 0; min-height: 100vh;">
    <!-- 0ms Hardware-Accelerated Splash Screen (GPU composited, ultra-smooth on Firefox & all browsers) -->
    <div id="initial-splash" style="position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:#FFFDF5;z-index:99999;will-change:opacity;transform:translateZ(0);transition:opacity 0.35s cubic-bezier(0.16,1,0.3,1);">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 32px;background:#FFD93D;border:3px solid #000;box-shadow:8px 8px 0px 0px #000;width:100%;max-width:320px;text-align:center;box-sizing:border-box;will-change:transform;transform:translateZ(0);">
        <div style="width:62px;height:62px;background:#280736;border:3px solid #000;box-shadow:4px 4px 0px 0px #000;display:flex;align-items:center;justify-content:center;overflow:hidden;">
          <img src="/logo-icon.png" alt="SkyCode" width="62" height="62" style="width:100%;height:100%;object-fit:cover;display:block;" />
        </div>
        <div style="font-family:'Space Grotesk',sans-serif,system-ui;font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:-0.03em;color:#000;">SkyCode</div>
        <div style="font-family:'Space Grotesk',sans-serif,system-ui;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;color:rgba(0,0,0,0.75);">LOADING LOGIN PAGE…</div>
        <div style="width:100%;height:10px;background:rgba(0,0,0,0.15);border:2px solid #000;margin-top:8px;overflow:hidden;box-sizing:border-box;">
          <div style="height:100%;background:#000;width:100%;transform-origin:left;transform:scaleX(0);animation:initial-load 0.72s cubic-bezier(0.16,1,0.3,1) forwards;will-change:transform;"></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes initial-load {
        0%   { transform: scaleX(0); }
        100% { transform: scaleX(1); }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
