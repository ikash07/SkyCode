services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/online_ide
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:8080
      DOCKER_EXECUTION_TIMEOUT_SECONDS: 12
      DOCKER_EXECUTION_MEMORY_MB: 512
      DOCKER_EXECUTION_CPU_QUOTA: 1
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
